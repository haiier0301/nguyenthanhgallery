<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="../images/assets/favicon.png">
    <title>Exhibitions Management - CMS</title>
    <link rel="stylesheet" href="admin-style.css">
</head>
<body>
    <div class="cms-dashboard">
        <!-- Sidebar -->
        <aside class="cms-sidebar">
            <div class="cms-logo">
                <h2>NGUYEN THANH GALLERY</h2>
                <p>Content Management</p>
            </div>
            
            <nav>
                <ul class="cms-nav">
                    <li><a href="dashboard.html">Dashboard</a></li>
                    <li><a href="artists.html">Artists</a></li>
                    <li><a href="artworks.html">Artworks</a></li>
                    <li><a href="exhibitions.html" class="active">Exhibitions</a></li>
                    <li><a href="art-fairs.html">Art Fairs</a></li>
                    <li><a href="media.html">Media Library</a></li>
                    <li><a href="settings.html">Settings</a></li>
                </ul>
            </nav>
            
            <div class="cms-logout">
                <button id="logoutBtn">Logout</button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="cms-main">
            <div class="cms-header">
                <h1>Exhibitions Management</h1>
                <p>Manage exhibition history, awards, and group shows</p>
            </div>

            <!-- Actions -->
            <div class="cms-actions">
                <button class="btn-primary" onclick="openAddExhibitionModal()">+ Add Exhibition</button>
                <button class="btn-secondary" onclick="loadExhibitions()">Refresh</button>
            </div>

            <!-- Exhibitions Table -->
            <div class="cms-table">
                <table>
                    <thead>
                        <tr>
                            <th>Year</th>
                            <th>Type</th>
                            <th>Title</th>
                            <th>Location</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="exhibitionsTableBody">
                        <tr>
                            <td colspan="5" style="text-align: center; padding: 40px;">Loading exhibitions...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <!-- Add/Edit Exhibition Modal -->
    <div class="modal" id="exhibitionModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Add New Exhibition</h2>
                <button class="modal-close" onclick="hideModal('exhibitionModal')">&times;</button>
            </div>
            <form id="exhibitionForm">
                <div class="modal-body">
                    <input type="hidden" id="exhibitionId" name="id">
                    
                    <div class="form-group">
                        <label for="exhibitionYear">Year *</label>
                        <input type="number" id="exhibitionYear" name="year" required min="1900" max="2100">
                    </div>
                    
                    <div class="form-group">
                        <label for="exhibitionType">Type *</label>
                        <select id="exhibitionType" name="type" required>
                            <option value="solo">Solo Exhibition</option>
                            <option value="group">Group Exhibition</option>
                            <option value="award">Award / Recognition</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="exhibitionTitle">Title *</label>
                        <input type="text" id="exhibitionTitle" name="title" required placeholder="Exhibition title">
                    </div>
                    
                    <div class="form-group">
                        <label for="exhibitionLocation">Location</label>
                        <input type="text" id="exhibitionLocation" name="location" placeholder="City, Country">
                    </div>
                    
                    <div class="form-group">
                        <label for="exhibitionDescription">Description</label>
                        <textarea id="exhibitionDescription" name="description" rows="4"></textarea>
                    </div>
                </div>
                
                <div class="modal-footer">
                    <button type="button" class="btn-secondary" onclick="hideModal('exhibitionModal')">Cancel</button>
                    <button type="submit" class="btn-primary">Save Exhibition</button>
                </div>
            </form>
        </div>
    </div>

    <script src="admin-script.js"></script>
    <script src="exhibitions-manager.js"></script>
</body>
</html>
