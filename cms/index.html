<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="../images/assets/favicon.png">
    <title>CMS Login - Nguyen Thanh Gallery</title>
    <link rel="stylesheet" href="admin-style.css">
</head>
<body class="cms-login-page">
    <div class="login-container">
        <div class="login-box">
            <h1 class="login-title">NGUYEN THANH GALLERY</h1>
            <p class="login-subtitle">Content Management System</p>
            
            <form id="loginForm" class="login-form">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required autocomplete="username">
                </div>
                
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required autocomplete="current-password">
                </div>
                
                <button type="submit" class="btn-primary">LOGIN</button>
                
                <p class="login-error" id="loginError" style="display: none;"></p>
            </form>
            
            <div class="login-info">
                <p><small>Default credentials: admin / admin123</small></p>
                <p><small>Production: set CMS_ADMIN_USERNAME and CMS_ADMIN_PASSWORD on server.</small></p>
            </div>
        </div>
    </div>

    <script src="/cms/admin-script.js"></script>
</body>
</html>
